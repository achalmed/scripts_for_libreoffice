# suite.yml — contrato de la suite (esquema en core/suite.schema.yml); core/suites.py generar escribe los índices y READMEs.
nombre: docflow
objetivo: documentos
resumen: Flujos de conversión y ofimática (LibreOffice, pandoc) para documentos de trabajo; herramienta en bin/ con instalador.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.sh --help
- main.sh convert <archivo> --to pdf
- 'bin/docflow …           # mismo programa'
estado: activo
nota: config en config/defaults.conf y lib/core/config.sh; logger propio con niveles y modo quiet (excepción documentada a core/shell-lib)
