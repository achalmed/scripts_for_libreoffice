# backends/pdf-suite/suite.yml — suite pdf_suite: Manipulación de PDF: comprimir, unir, dividir, rotar, convertir, metadatos, OCR, proteger, reparar.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: pdf_suite
objetivo: documentos
resumen: 'Manipulación de PDF: comprimir, unir, dividir, rotar, convertir, metadatos, OCR, proteger, reparar.'
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- 'main.sh                      # menú'
- main.sh compress <pdf>
- main.sh ocr <pdf>
- main.sh merge a.pdf b.pdf
estado: activo
depende_de:
- qpdf
- ghostscript
- ocrmypdf
- exiftool
