# config/defaults.conf — Valores por defecto de docflow (bash sourceable).
# NO edites este archivo: tus ajustes van en ~/.config/docflow/config.toml
# (genera una plantilla con `docflow config init`).
# Precedencia: CLI > config.toml > este archivo.

# --- General -----------------------------------------------------------
DOCFLOW_JOBS="$(nproc 2>/dev/null || echo 2)"   # workers en paralelo
DOCFLOW_OVERWRITE=false        # nunca sobreescribir salvo --overwrite
DOCFLOW_DRY_RUN=false
DOCFLOW_FORCE=false
DOCFLOW_JSON=false             # salida JSON en stdout para automatización
DOCFLOW_VERIFY=true            # verificación post-conversión
DOCFLOW_CACHE=true             # caché SHA-256 (no reconvierte sin cambios)
DOCFLOW_RESUME=false           # reanudar: omite salidas ya existentes válidas

# --- Salida ------------------------------------------------------------
DOCFLOW_OUTPUT_DIR=""          # vacío = junto al original

# --- Originales --------------------------------------------------------
DOCFLOW_DELETE_ORIGINALS=false # solo elimina convertidos con éxito (confirma)
DOCFLOW_BACKUP_ORIGINALS=false # mueve originales convertidos a _backup/
DOCFLOW_BACKUP_DIR_NAME="_backup"

# --- Exclusiones por defecto (nombres de directorio) --------------------
DOCFLOW_DEFAULT_EXCLUDES=".git .svn .hg node_modules __pycache__ .venv venv .trash Trash .Trash _backup _site _freeze .quarto .obsidian"

# --- Markdown Engine ----------------------------------------------------
DOCFLOW_MD_FLAVOR="gfm"        # gfm | obsidian | logseq | mkdocs | hugo | quarto
DOCFLOW_MD_METADATA=true       # frontmatter YAML con metadatos del documento
DOCFLOW_MD_CLEAN=true          # limpieza del Markdown generado
DOCFLOW_MD_SLIDE_SEPARATOR="---"  # separador entre diapositivas
DOCFLOW_MD_INCLUDE_NOTES=true  # exportar notas del presentador
DOCFLOW_PANDOC_ARGS=""         # argumentos extra para pandoc

# --- Media Engine -------------------------------------------------------
DOCFLOW_IMG_FORMAT="keep"      # keep | png | jpg | webp | avif
DOCFLOW_IMG_QUALITY=90         # calidad para formatos con pérdida (1-100)
DOCFLOW_IMG_MAX_WIDTH=0        # 0 = sin redimensionar
DOCFLOW_IMG_OPTIMIZE=false     # optimización sin pérdida cuando sea posible

# --- PDF Engine ---------------------------------------------------------
DOCFLOW_PDF_ENGINE="auto"      # auto | soffice | pandoc | wkhtmltopdf | weasyprint
DOCFLOW_PDF_PDFA=false         # producir PDF/A (requiere ghostscript)
DOCFLOW_PDF_COMPRESS=false     # comprimir el PDF resultante

# --- OCR Engine ---------------------------------------------------------
DOCFLOW_OCR=false              # OCR para PDFs escaneados (requiere ocrmypdf)
DOCFLOW_OCR_LANG="spa+eng"

# --- Watch Engine -------------------------------------------------------
DOCFLOW_WATCH_INTERVAL=30      # segundos entre ciclos (modo polling)
DOCFLOW_WATCH_SETTLE=1         # espera tras detectar archivo (sincronizadores)

# --- Reportes -----------------------------------------------------------
DOCFLOW_REPORT_FORMATS=""      # ej: "html,json" — vacío = no generar
DOCFLOW_REPORT_OUT=""          # directorio de reportes; vacío = estado XDG

# --- Hooks --------------------------------------------------------------
DOCFLOW_PRE_HOOK=""            # comando antes de cada conversión
DOCFLOW_POST_HOOK=""           # comando después de cada conversión
