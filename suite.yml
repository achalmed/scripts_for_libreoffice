# suite.yml — contrato de la suite (esquema en core/suite.schema.yml); core/suites.py generar escribe los índices y READMEs.
nombre: document_studio
objetivo: documentos
resumen: Interfaz de escritorio (PySide6) sobre docflow, pdf-suite y page-counter.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py
- './run.sh                 # usa el .venv si existe'
- python3 -m studio
estado: activo
interfaz: gui
depende_de:
- PySide6
nota: config en studio/core/settings.py (QSettings); backends docflow, pdf-suite y page-counter en backends/
